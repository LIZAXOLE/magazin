<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASHION - Let's Explore Unique Clothes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <header class="header">
        <div class="logo">FASHION</div>
        <nav class="nav">
            <ul class="nav__list">
                <li class="nav__item"><a href="#" class="nav__link">Catalogue</a></li>
                <li class="nav__item"><a href="#" class="nav__link">Fashion</a></li>
                <li class="nav__item"><a href="#" class="nav__link">Favourite</a></li>
                <li class="nav__item"><a href="#" class="nav__link">Lifestyle</a></li>
            </ul>
        </nav>
        <a href="#" class="btn btn--dark">Sign Up</a>
    </header>

    
    <section class="hero">
        <div class="hero__content">
            <h1 class="hero__title">
                <span class="highlight highlight--white">Let's</span>
                <br>Explore<br>
                <span class="highlight highlight--yellow">Unique</span><br>
                Clothes.
            </h1>
            <p class="hero__subtitle">Live for Influential and Innovative fashion!</p>
            <a href="#" class="btn btn--dark btn--shop">Shop Now</a>
        </div>
        <div class="hero__image">
            <img src="girl.png" alt="Fashion Model">
        </div>
    </section>
    
    <section class="brands">
        <div class="brands__item brands__item--hm">H&amp;M</div>
        <div class="brands__item brands__item--obey">OBEY</div>
        <div class="brands__item brands__item--shopify">🛍️ shopify</div>
        <div class="brands__item brands__item--lacoste">LACOSTE 🐊</div>
        <div class="brands__item brands__item--levis">Levi's</div>
        <div class="brands__item brands__item--amazon">amazon</div>
    </section>
    

    <header class="header">
        <div class="logo">NEW ARRIVALS</div>


</body>
</html>
